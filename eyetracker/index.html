<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Eye Tracking Experiment</title>

  <script src="webgazer.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #f5f5f5;
      overflow: hidden;
    }

    #ui-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    button {
      margin: 8px;
      padding: 10px 22px;
      font-size: 15px;
      cursor: pointer;
    }

    .calib-dot {
      position: fixed;
      width: 22px;
      height: 22px;
      background: red;
      border-radius: 50%;
      z-index: 1000;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      color: red;
    }
  </style>
</head>

<body>

<div id="ui-container">
  <h3>Eye Tracking Experiment</h3>

  <button onclick="startCalibration()">Start 9-Point Calibration</button><br>
  <button onclick="startSession()">Start Eye Tracking Session</button>
  <button onclick="stopAndDownload()">Stop & Download CSV</button>

  <div id="status"></div>
</div>

<script>
/* ===================== GLOBAL STATE ===================== */
let gazeData = [];
let isRunning = false;
let calibrated = false;

/* ---- EEG-aligned variables ---- */
let secIndex = 1;
let secondStart = null;
let samplesThisSecond = [];

/* ---- Screen dimensions ---- */
let SCREEN_W = window.innerWidth;
let SCREEN_H = window.innerHeight;

/* ===================== SEND TO PYTHON (SAME ORIGIN) ===================== */
function sendToPython(payload) {
  fetch("/gaze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

/* ===================== INIT WEBGAZER ===================== */
window.onload = () => {
  webgazer
    .setTracker("TFFacemesh")
    .setRegression("ridge")
    .begin();

  webgazer.showVideo(true);
  webgazer.showFaceOverlay(true);
  webgazer.showFaceFeedbackBox(true);

  window.saveDataAcrossSessions = false;
};

/* ===================== CALIBRATION ===================== */
let calibPoints = [];
let calibIndex = 0;

function startCalibration() {
  calibrated = false;
  calibIndex = 0;

  const w = window.innerWidth;
  const h = window.innerHeight;

  calibPoints = [
    [0.1*w, 0.1*h], [0.5*w, 0.1*h], [0.9*w, 0.1*h],
    [0.1*w, 0.5*h], [0.5*w, 0.5*h], [0.9*w, 0.5*h],
    [0.1*w, 0.9*h], [0.5*w, 0.9*h], [0.9*w, 0.9*h]
  ];

  document.getElementById("status").innerText =
    "CALIBRATING… Look at each dot and CLICK it.";

  showCalibPoint();
}

function showCalibPoint() {
  if (calibIndex >= calibPoints.length) {
    calibrated = true;
    document.getElementById("status").innerText =
      "Calibration complete. Click START SESSION.";
    return;
  }

  const [x, y] = calibPoints[calibIndex];
  const dot = document.createElement("div");
  dot.className = "calib-dot";
  dot.style.left = (x - 11) + "px";
  dot.style.top = (y - 11) + "px";

  dot.onclick = () => {
    document.body.removeChild(dot);
    calibIndex++;
    showCalibPoint();
  };

  document.body.appendChild(dot);
}

/* ===================== SESSION ===================== */
function startSession() {
  if (!calibrated) {
    alert("Please complete calibration first!");
    return;
  }

  if (isRunning) {
    alert("Session already running!");
    return;
  }

  webgazer.resume();

  gazeData = [];
  secIndex = 1;
  secondStart = null;
  samplesThisSecond = [];

  webgazer.setGazeListener((data, elapsedTime) => {
    if (!data || !isRunning) return;

    data = webgazer.util.bound(data);

    if (secondStart === null) {
      secondStart = elapsedTime;
    }

    samplesThisSecond.push({ x: data.x, y: data.y });

    if (elapsedTime - secondStart >= 1000) {
      const xs = samplesThisSecond.map(p => p.x);
      const ys = samplesThisSecond.map(p => p.y);

      const x_pos = xs.reduce((a, b) => a + b, 0) / xs.length;
      const y_pos = ys.reduce((a, b) => a + b, 0) / ys.length;

      const payload = {
        sec_index: secIndex,
        x_pos: x_pos,
        y_pos: y_pos,
        n_samples: samplesThisSecond.length,
        screen_w: SCREEN_W,
        screen_h: SCREEN_H,
        timestamp: Date.now() / 1000
      };

      gazeData.push(payload);   // offline CSV
      sendToPython(payload);    // real-time Python

      console.log(`Sec ${secIndex}`, x_pos.toFixed(1), y_pos.toFixed(1));

      secIndex++;
      secondStart = elapsedTime;
      samplesThisSecond = [];
    }
  });

  isRunning = true;
  document.getElementById("status").innerText =
    "RECORDING… Do not move mouse.";

  const dpr = window.devicePixelRatio || 1;
  webgazer.setVideoElementCanvasPosition(0, 0);
  webgazer.setVideoElementCanvasSize(
    window.innerWidth * dpr,
    window.innerHeight * dpr
  );
}

function stopAndDownload() {
  if (!isRunning) {
    alert("Session not running!");
    return;
  }

  webgazer.pause();
  isRunning = false;
  document.getElementById("status").innerText = "";

  let csv = "sec_index,x_pos,y_pos,n_samples,screen_w,screen_h\n";
  gazeData.forEach(g => {
    csv += `${g.sec_index},${g.x_pos},${g.y_pos},${g.n_samples},${g.screen_w},${g.screen_h}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "eye_gaze_per_second.csv";
  a.click();
}

/* ===================== RESIZE ===================== */
window.addEventListener("resize", () => {
  SCREEN_W = window.innerWidth;
  SCREEN_H = window.innerHeight;

  const dpr = window.devicePixelRatio || 1;
  webgazer.setVideoElementCanvasSize(
    window.innerWidth * dpr,
    window.innerHeight * dpr
  );
});
</script>

</body>
</html>
